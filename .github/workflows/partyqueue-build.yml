name: PartyQueue SmartTube Build

on:
  push:
    branches:
      - feature/partyqueue-current
      - port/rest-api-5797
      - port/partyqueue-events
    tags:
      - "partyqueue-*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure signing
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > key.jks
      - name: Verify signing keystore
        shell: bash
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          keytool -list \
            -keystore "${{ github.workspace }}/key.jks" \
            -storepass "$KEY_STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "Signing keystore verified successfully"
      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed Stbeta Release
        run: ./gradlew assembleStbetaRelease

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p artifacts
          find smarttubetv/build/outputs/apk -type f -name "*.apk" -exec cp {} artifacts/ \;
          ls -lah artifacts

      - name: Generate PartyQueue update manifest
        if: startsWith(github.ref, 'refs/tags/partyqueue-')
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' smarttubetv/build.gradle | head -1)
          TAG="${GITHUB_REF_NAME}"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          python3 - "$VERSION_CODE" "$TAG" "$RELEASE_BASE" <<'PYMANIFEST'
          import glob, json, os, sys
          version_code, tag, base = int(sys.argv[1]), sys.argv[2], sys.argv[3]
          apks = [os.path.basename(p) for p in glob.glob('artifacts/*.apk')]
          def urls(token):
              matches = [f'{base}/{name}' for name in apks if token in name]
              return matches
          package = {}
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86'):
              values = urls(abi)
              if values: package[f'downloadUrlList_{abi}'] = values
          universal = urls('universal') or [f'{base}/{name}' for name in apks]
          package['downloadUrlList'] = universal
          manifest = {
              'package': package,
              tag: {
                  'versionCode': version_code,
                  'changelog': [
                      'PartyQueue REST API and playback events',
                      'PartyQueue update channel from domhit/SmartTube',
                      'PartyQueue settings dialog fixes'
                  ]
              }
          }
          with open('artifacts/smarttube_partyqueue.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PYMANIFEST
          cat artifacts/smarttube_partyqueue.json

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-partyqueue-release
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/partyqueue-')
        uses: softprops/action-gh-release@v2
        with:
          name: SmartTube PartyQueue ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            artifacts/*.apk
            artifacts/smarttube_partyqueue.json

      - name: Update moving PartyQueue channel
        if: startsWith(github.ref, 'refs/tags/partyqueue-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-alpha* || "${GITHUB_REF_NAME}" == *-beta* || "${GITHUB_REF_NAME}" == *-rc* ]]; then
            CHANNEL=partyqueue-prerelease-latest
            PRERELEASE_FLAG=--prerelease
          else
            CHANNEL=partyqueue-latest
            PRERELEASE_FLAG=--latest
          fi
          gh release delete "$CHANNEL" --cleanup-tag --yes 2>/dev/null || true
          git push origin ":refs/tags/$CHANNEL" 2>/dev/null || true
          gh release create "$CHANNEL" artifacts/*.apk artifacts/smarttube_partyqueue.json \
            --title "SmartTube PartyQueue latest channel" \
            --notes "Moving update channel for ${GITHUB_REF_NAME}." \
            $PRERELEASE_FLAG
